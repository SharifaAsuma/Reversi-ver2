<!doctype html>
<html lang="ja">
  <head>
    <!-- 文字コードをUTF-8に指定(日本語の文字化けを防ぐ) -->
    <meta charset="UTF-8" />
    <!-- ブラウザのタブに表示されるファビコン(アイコン画像)を指定 -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- スマホなどの画面幅に合わせて表示を最適化するレスポンシブ対応設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ブラウザのタブに表示されるタイトル -->
    <title>リバーシ | Reversi</title>
    <!-- SNSでリンクをシェアした際に表示される画像(OGP画像)の設定 -->
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <!-- Twitter(X)でシェアされた際の表示形式(大きい画像付きカード)の指定 -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Twitter(X)でシェアされた際に表示される画像の指定 -->
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <!-- Reactアプリ全体がここに描画されるマウントポイント -->
    <div id="root"></div>
    <!-- アプリのエントリーポイント(起動ファイル)を読み込むスクリプト -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
